name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks_scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Run Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: detect --source ./rhino-horn --report-path gitleaks-report.json --exit-code 1

    - name: Upload Gitleaks Report
      if: always() # Upload even if secrets are found
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: gitleaks-report.json

  dockerfile_security_check:
    needs: gitleaks_scan
    name: Dockerfile Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile for secure USER usage
        run: |
          chmod +x rhino-horn/dockerfile-check.sh
          ./rhino-horn/dockerfile-check.sh

  maven_build:
    needs: dockerfile_security_check
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        java: [17]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'maven'

    - name: Build with Maven
      run: |
       mvn -B package --file rhino-horn/pom.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rhino-horn
        path: rhino-horn/target/

  sonar_cloud_scan:
    needs: maven_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: actions/download-artifact@v4
        with:
          name: rhino-horn
          path: rhino-horn/target/

      - name: Sonarqube Scan
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -file rhino-horn/pom.xml \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=rhino-horn/target/classes

  docker_build_scan_and_push:
    needs: sonar_cloud_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rhino-horn
          path: rhino-horn/target/

      - name: Build Docker image for analysis
        uses: docker/build-push-action@v5
        with:
          context: ./rhino-horn
          file: rhino-horn/Dockerfile
          push: false
          load: true
          build-args: |
              APP_VERSION=${{ steps.vars.outputs.SHORT_SHA }}
          tags: |
              colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}
              colanta06/rhino-horn:latest

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true

      - name: Run Trivy image scan (HTML report)
        run: |
          trivy image \
              --format html \
              --output trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --vuln-type 'os,library'\
              --ignore-unfixed \
              colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html

      - name: Push Docker image (if scan passed)
        uses: docker/build-push-action@v5
        with:
          context: ./rhino-horn
          file: rhino-horn/Dockerfile
          push: true
          build-args: |
              APP_VERSION=${{ steps.vars.outputs.SHORT_SHA }}
          tags: colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

  upload_trivy_report_to_s3:
    needs: docker_build_scan_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Trivy report to S3
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          aws s3 cp trivy-report-${SHORT_SHA}.html s3://${{ vars.BUCKET_NAME }}/reports/${{ github.sha }}-trivy-report-${SHORT_SHA}.html