name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks_scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          detect: true
          source: ./rhino-horn
          report-path: rhino-horn/gitleaks-report.html
          exit-code: 1

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: rhino-horn/gitleaks-report.html

  dockerfile_security_check:
    needs: gitleaks_scan
    name: Dockerfile Security Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Dockerfile for secure USER usage
        run: |
          chmod +x rhino-horn/dockerfile-check.sh
          ./rhino-horn/dockerfile-check.sh

  maven_build:
    needs: dockerfile_security_check
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        java: [17]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file rhino-horn/pom.xml

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhino-horn-${{ matrix.os }}-java-${{ matrix.java }}
          path: rhino-horn/target/*.jar
          if-no-files-found: error

  sonar_cloud_scan:
    needs: maven_build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: rhino-horn-ubuntu-26.04-java-17
          path: rhino-horn/target

      - name: Display structure of downloaded files
        run: ls -R rhino-horn/target

      - name: Sonarqube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.verbose=false

  docker_build_scan_and_push:
    needs: sonar_cloud_scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: rhino-horn-ubuntu-26.04-java-17
          path: rhino-horn/target

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./rhino-horn
          file: rhino-horn/Dockerfile
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.SHORT_SHA }}
          tags: |
            colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Fetch Trivy HTML template
        run: |
          curl -fsSL -o html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl  

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}
          format: template
          template: '@html.tpl'
          output: trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html

      - name: Push scanned image
        run: |
          docker push colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

  upload_trivy_report_to_s3:
    needs: docker_build_scan_and_push
    runs-on: ubuntu-26.04
    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v8
        with:
          name: trivy-report

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Trivy report to S3
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          aws s3 cp trivy-report-${SHORT_SHA}.html s3://${{ vars.BUCKET_NAME }}/reports/${{ github.sha }}-trivy-report-${SHORT_SHA}.html