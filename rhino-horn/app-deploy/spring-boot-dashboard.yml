apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  spring-app.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 1, "text": "DOWN" }, "1": { "color": "green", "index": 0, "text": "UP" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "up{job=\"spring-api\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Up",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "reqps" },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 9, "x": 6, "y": 0 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{job=\"spring-api\"}[5m]))",
              "legendFormat": "{{status}} {{uri}}",
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 6, "w": 9, "x": 15, "y": 0 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"spring-api\", status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{job=\"spring-api\"}[5m]))",
              "legendFormat": "5xx ratio",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"spring-api\", status=~\"4..\"}[5m])) / sum(rate(http_server_requests_seconds_count{job=\"spring-api\"}[5m]))",
              "legendFormat": "4xx ratio",
              "refId": "B"
            }
          ],
          "title": "Error Ratio",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "s" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_sum{job=\"spring-api\"}[5m])) / sum(rate(http_server_requests_seconds_count{job=\"spring-api\"}[5m]))",
              "legendFormat": "avg",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(http_server_requests_seconds_max{job=\"spring-api\"})",
              "legendFormat": "max",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(http_server_requests_active_seconds_sum{job=\"spring-api\"}) / sum(http_server_requests_active_seconds_count{job=\"spring-api\"})",
              "legendFormat": "in-flight (avg)",
              "refId": "C"
            }
          ],
          "title": "Request Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 1 }, "unit": "bytes" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (area) (jvm_memory_used_bytes{job=\"spring-api\"})",
              "legendFormat": "{{area}} used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (area) (jvm_memory_max_bytes{job=\"spring-api\"})",
              "legendFormat": "{{area}} max",
              "refId": "B"
            }
          ],
          "title": "JVM Memory",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "s" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (action) (rate(jvm_gc_pause_seconds_sum{job=\"spring-api\"}[5m]))",
              "legendFormat": "{{action}}",
              "refId": "A"
            }
          ],
          "title": "GC Pause Time (rate)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 14 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_gc_overhead{job=\"spring-api\"})",
              "legendFormat": "GC overhead",
              "refId": "A"
            }
          ],
          "title": "GC Overhead",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 14 },
          "id": 8,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (state) (jvm_threads_states_threads{job=\"spring-api\"})",
              "legendFormat": "{{state}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_threads_live_threads{job=\"spring-api\"})",
              "legendFormat": "live",
              "refId": "B"
            }
          ],
          "title": "JVM Threads",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 22 },
          "id": 9,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (process_cpu_usage{job=\"spring-api\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Process CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "bytes" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 22 },
          "id": 10,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"dev\", pod=~\"spring-api-.*\", container=\"app\"})",
              "legendFormat": "{{pod}} working set",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (container_spec_memory_limit_bytes{namespace=\"dev\", pod=~\"spring-api-.*\", container=\"app\"})",
              "legendFormat": "{{pod}} limit",
              "refId": "B"
            }
          ],
          "title": "Container Memory",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "s" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 22 },
          "id": 11,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (process_uptime_seconds{job=\"spring-api\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Process Uptime",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 30 },
          "id": 12,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (tomcat_sessions_active_current_sessions{job=\"spring-api\"})",
              "legendFormat": "{{pod}} active",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (tomcat_sessions_created_sessions_total{job=\"spring-api\"})",
              "legendFormat": "{{pod}} created",
              "refId": "B"
            }
          ],
          "title": "Tomcat Sessions",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "ops" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 30 },
          "id": 13,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (level) (rate(logback_events_total{job=\"spring-api\"}[5m]))",
              "legendFormat": "{{level}}",
              "refId": "A"
            }
          ],
          "title": "Logback Events",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 30 },
          "id": 14,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (jvm_classes_loaded_classes{job=\"spring-api\"})",
              "legendFormat": "{{pod}} loaded",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (process_open_fds{job=\"spring-api\"})",
              "legendFormat": "{{pod}} open fds",
              "refId": "B"
            }
          ],
          "title": "Classes & FDs",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["spring-boot", "rhino-horn", "dev"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Spring Boot — rhino-horn (spring-api)",
      "uid": "rhino-horn-spring-api",
      "version": 1,
      "weekStart": ""
    }
